<div class="relative min-h-screen flex items-center justify-center overflow-hidden bg-[#0a0e1a]">

  <!-- background glow -->
  <div class="absolute w-[600px] h-[600px] bg-cyan-500/20 blur-[200px] rounded-full top-[-200px] left-[-200px]"></div>
  <div class="absolute w-[500px] h-[500px] bg-blue-500/20 blur-[200px] rounded-full bottom-[-200px] right-[-200px]"></div>

  <!-- card -->
  <div
  class="relative w-full max-w-md p-10 rounded-3xl border border-white/10 backdrop-blur-2xl bg-white/5 shadow-[0_10px_40px_rgba(0,0,0,0.5)]">

    <!-- logo -->
    <div class="flex flex-col items-center mb-8">

      <div class="text-4xl mb-3">🚗</div>

      <h1 class="text-3xl font-bold text-white text-center">
        Guliston Avtomaktab
      </h1>

    </div>

    <form (ngSubmit)="handleSubmit()" class="space-y-6">

      <!-- PHONE -->
      <div class="relative">

        <label
        class="absolute left-4 transition-all duration-200"
        [class]="focusedField() === 'phone' || phoneNumber() !== '+998 '
        ? '-top-2 text-xs text-cyan-400'
        : 'top-4 text-gray-400'"
        >
        Telefon raqami
        </label>

        <input
        type="tel"
        [ngModel]="phoneNumber()"
        (ngModelChange)="phoneNumber.set($event)"
        name="phone"
        (focus)="focusedField.set('phone')"
        (blur)="focusedField.set(null)"
        (input)="handlePhoneChange($event)"
        class="w-full rounded-xl border border-white/10 px-4 pt-6 pb-3 text-white bg-white/5
        focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/30 outline-none transition"
        />

      </div>

      <!-- PASSWORD -->
      <div class="relative">

        <label
        class="absolute left-4 transition-all duration-200"
        [class]="focusedField() === 'password' || password()
        ? '-top-2 text-xs text-cyan-400'
        : 'top-4 text-gray-400'"
        >
        Parol
        </label>

        <input
        [type]="showPassword() ? 'text' : 'password'"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        name="password"
        (focus)="focusedField.set('password')"
        (blur)="focusedField.set(null)"
        class="w-full rounded-xl border border-white/10 px-4 pt-6 pb-3 text-white bg-white/5
        focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/30 outline-none transition"
        />

        <button
        type="button"
        (click)="togglePassword()"
        class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-cyan-400"
        >
        {{showPassword() ? '🙈' : '👁'}}
        </button>

      </div>

      <!-- remember + forgot -->
      <div class="flex justify-between text-sm">

        <label class="flex items-center gap-2 text-gray-400 cursor-pointer">
          <input type="checkbox" class="accent-cyan-500">
          Eslab qolish
        </label>

        <a class="text-cyan-400 hover:text-cyan-300 cursor-pointer">
          Parolni unutdingizmi?
        </a>

      </div>

      <!-- button -->
      <button
      type="submit"
      (click)="handleSubmit()"  
      class="w-full py-4 rounded-xl font-bold text-white
      bg-gradient-to-r from-cyan-400 to-blue-600
      hover:scale-105 hover:shadow-[0_10px_30px_rgba(0,150,255,0.5)]
      transition-all duration-300"
      >
      Tizimga kirish
      </button>

    </form>

    <!-- divider -->
    <div class="flex items-center gap-4 my-6">

      <div class="flex-1 h-px bg-white/10"></div>

      <span class="text-gray-400 text-sm">yoki</span>

      <div class="flex-1 h-px bg-white/10"></div>

    </div>

    <!-- social login -->
    <div class="grid grid-cols-2 gap-4">

  <!-- GOOGLE -->
    <button
    class="flex items-center justify-center gap-2 py-3 rounded-xl border border-white/10 text-white bg-white/5 hover:bg-white/10 transition"
    >

    <!-- Google Icon -->
    <svg class="w-5 h-5" viewBox="0 0 48 48">

      <path fill="#FFC107"
      d="M43.6 20.5H42V20H24v8h11.3C33.6 32.7 29.2 36 24 36
      c-6.6 0-12-5.4-12-12s5.4-12 12-12
      c3 0 5.7 1.1 7.8 3l5.7-5.7C34.6 6.1 29.6 4 24 4
      12.9 4 4 12.9 4 24s8.9 20 20 20
      20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>

      <path fill="#FF3D00"
      d="M6.3 14.7l6.6 4.8C14.5 16.1 18.9 13 24 13
      c3 0 5.7 1.1 7.8 3l5.7-5.7C34.6 6.1 29.6 4 24 4
      16.3 4 9.7 8.2 6.3 14.7z"/>

      <path fill="#4CAF50"
      d="M24 44c5.1 0 9.8-1.9 13.4-5.1
      l-6.2-5.1C29.3 35.1 26.8 36 24 36
      c-5.2 0-9.6-3.3-11.1-7.9
      l-6.5 5C9.7 39.8 16.3 44 24 44z"/>

      <path fill="#1976D2"
      d="M43.6 20.5H42V20H24v8h11.3
      c-1.1 3.1-3.4 5.7-6.1 7.2
      l6.2 5.1C39.9 36.6 44 30.9 44 24
      c0-1.3-.1-2.7-.4-3.5z"/>

    </svg>

    Google

  </button>


  <!-- TELEGRAM -->
  <button
  class="flex items-center justify-center gap-2 py-3 rounded-xl border border-white/10 text-white bg-white/5 hover:bg-white/10 transition"
  >

    <!-- Telegram Icon -->
    <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    class="w-5 h-5 text-[#2AABEE]"
    fill="currentColor"
    >

      <path
      d="M9.04 15.48l-.38 5.32c.54 0 .77-.23 1.05-.51l2.52-2.41
      5.23 3.82c.96.53 1.64.25 1.9-.89l3.45-16.2
      c.33-1.54-.55-2.15-1.49-1.8L1.73 9.23
      c-1.5.58-1.48 1.41-.26 1.79l4.99 1.56
      11.59-7.31c.55-.34 1.05-.15.64.19"/>

    </svg>

    Telegram

  </button>

</div>

  </div>

</div>
