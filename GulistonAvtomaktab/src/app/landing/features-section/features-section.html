<section id="features" class="py-20 bg-[#F8FAFB]">

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <div class="text-center mb-16">
      <h2 class="text-4xl sm:text-5xl font-bold text-[#0A2647] mb-4">
        Avtomaktabimizning imkoniyatlari
      </h2>

      <p class="text-xl text-gray-600 max-w-3xl mx-auto">
        Muvaffaqiyatli o'rganish uchun zarur bo'lgan barcha vositalar bir joyda
      </p>
    </div>

    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-8">

      @for (feature of features; track feature)
      {
        <div
        class="bg-white rounded-2xl p-8 shadow-sm hover:shadow-xl transition-all duration-300 hover:-translate-y-1 border border-gray-100"
        >

        <div class="flex items-start justify-between mb-6">

          <div class="w-14 h-14 bg-[#0A2647]/10 rounded-xl flex items-center justify-center text-2xl">
            {{feature.icon}}
          </div>

          @if(feature.badge)
          {
            <span
            class="px-3 py-1 bg-[#00C853]/10 text-[#00C853] text-xs font-semibold rounded-full"
          >
            {{feature.badge}}
          </span>
          }


        </div>

        <h3 class="text-xl font-bold text-[#0A2647] mb-3">
          {{feature.title}}
        </h3>

        <p class="text-gray-600 leading-relaxed">
          {{feature.description}}
        </p>

        </div>
      }


    </div>

    <div class="mt-16 text-center">
      <button class="bg-[#00C853] hover:bg-[#00A844] text-white px-10 py-4 rounded-xl font-semibold text-lg shadow-lg hover:shadow-xl transition-all">
        Barcha imkoniyatlarni ko'rish
      </button>
    </div>

  </div>

</section>
