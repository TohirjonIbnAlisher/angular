<section class="py-20 bg-white relative overflow-hidden">
      <!-- Decorative Background Blobs -->
      <div class="absolute inset-0 opacity-5">
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-[#0A2647] rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-[#00C853] rounded-full blur-3xl"></div>
      </div>

      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
        <div class="text-center mb-16">
          <h2 class="text-4xl sm:text-5xl font-bold text-[#0A2647] mb-4">
            Qanday ishlaydi?
          </h2>
          <p class="text-xl text-gray-600 max-w-2xl mx-auto">
            4 ta oddiy qadam bilan muvaffaqiyatga erishing
          </p>
        </div>

        <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-8">

          @for(step of steps; track step; let isLast = $last)
          {
            <div class="relative">
              <!-- Connector Line -->
              @if(!isLast) {
                <div class="hidden lg:block absolute top-20 left-full w-full h-0.5 bg-gradient-to-r from-[#00C853] to-transparent -ml-8 z-0"></div>
              }

              <div class="relative z-10 text-center group">
                <!-- Number Badge -->
                <div class="text-6xl font-bold text-[#00C853]/10 mb-4 group-hover:text-[#00C853]/20 transition-colors">
                  {{ step.number }}
                </div>

                <!-- Icon -->
                <div class="w-20 h-20 bg-gradient-to-br from-[#0A2647] to-[#051526]
                rounded-2xl flex items-center justify-center mx-auto mb-6
                group-hover:scale-110 transition-transform shadow-lg
                text-4xl">
                  {{ step.icon }}
                </div>

                <!-- Content -->
                <h3 class="text-2xl font-bold text-[#0A2647] mb-4">
                  {{ step.title }}
                </h3>
                <p class="text-gray-600 leading-relaxed">
                  {{ step.description }}
                </p>



              </div>
            </div>
          }
        </div>

        <!-- CTA -->
        <div class="mt-16 text-center">
          <button class="bg-[#0A2647] hover:bg-[#051526] text-white px-10 py-4 rounded-xl font-semibold text-lg shadow-lg hover:shadow-xl transition-all">
            Hoziroq boshlang
          </button>
        </div>
      </div>
    </section>
