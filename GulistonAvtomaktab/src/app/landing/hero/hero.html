<section
      id="hero"
      class="relative min-h-screen flex items-center pt-20 overflow-hidden"
    >
      <!-- Background Image -->
      <div class="absolute inset-0 z-0">
        <img
          src="https://images.unsplash.com/photo-1598934386952-1deb6131cf10?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxtb2Rlcm4lMjBjYXIlMjBkcml2aW5nJTIwaGlnaHdheSUyMHV6YmVraXN0YW58ZW58MXx8fHwxNzcyODc0NzU5fDA&ixlib=rb-4.1.0&q=80&w=1080"
          alt="Modern car driving"
          class="w-full h-full object-cover"
        />
        <div class="absolute inset-0 bg-gradient-to-r from-[#0A2647]/95 via-[#0A2647]/85 to-[#0A2647]/70"></div>
      </div>

      <!-- Content -->
      <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20">
        <div class="grid lg:grid-cols-2 gap-12 items-center">
          <!-- Left Column - Text Content -->
          <div class="text-white">
            <div class="inline-flex items-center gap-2 bg-[#00C853]/20 backdrop-blur-sm border border-[#00C853]/30 rounded-full px-4 py-2 mb-6">
              <div class="w-2 h-2 bg-[#00C853] rounded-full animate-pulse"></div>
              <span class="text-sm font-medium text-[#00C853]">
                O'zbekistonning #1 online haydovchilik platformasi
              </span>
            </div>

            <h1 class="text-5xl sm:text-6xl lg:text-7xl font-bold mb-6 leading-tight">
              Guvohnoma nazariy imtihonini
              <span class="text-[#00C853]">birinchi urinishda</span>
              topshiring!
            </h1>

            <p class="text-xl sm:text-2xl text-gray-200 mb-8 leading-relaxed">
              Mavzulashtirilgan testlar • Tasodifiy random testlar • Video
              darslar • To'liq nazariya
            </p>

            <!-- CTA Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 mb-12">
              <Button
                size="lg"
                class="bg-[#00C853] hover:bg-[#00A844] text-white text-lg px-8 py-6 rounded-xl shadow-lg hover:shadow-xl transition-all group"
              >
                BEPUL TESTNI BOSHLASH
              </Button>
              <Button
                size="lg"
                variant="outline"
                class="border-2 border-white text-white hover:bg-white hover:text-[#0A2647] text-lg px-8 py-6 rounded-xl transition-all"
              >
                HOZIR RO'YXATDAN O'TING
              </Button>
            </div>

            <!-- Watch Video Button -->
            <button class="inline-flex items-center gap-3 text-white hover:text-[#00C853] transition-colors group">
              <div class="w-14 h-14 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center group-hover:bg-[#00C853] transition-all">
                <span class="text-2xl">▶</span>
              </div>
              <span class="font-medium">Videoni ko'rish</span>
            </button>
          </div>

          <!-- Right Column - Image with Stats -->
          <div class="relative hidden lg:block">
            <div class="relative">
              <div class="absolute -inset-4 bg-[#00C853]/20 rounded-3xl blur-2xl"></div>
              <img
                src="https://images.unsplash.com/photo-1660734194607-2f9548670761?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxoYXBweSUyMHlvdW5nJTIwYXNpYW4lMjBzdHVkZW50JTIwdGFibGV0JTIwc21pbGluZ3xlbnwxfHx8fDE3NzI4NzQ3NjB8MA&ixlib=rb-4.1.0&q=80&w=1080"
                alt="Happy student"
                class="relative rounded-3xl shadow-2xl"
              />
            </div>

            <!-- Social Media Icons -->
            <div class="absolute -bottom-6 -left-6 bg-white rounded-2xl shadow-xl p-6 max-w-xs">
              <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-[#00C853]/10 rounded-xl flex items-center justify-center">
                  <span class="text-2xl">✓</span>
                </div>
                <div>
                  <div class="font-bold text-2xl text-[#0A2647]">95%</div>
                  <div class="text-sm text-gray-600">
                    Muvaffaqiyat darajasi
                  </div>
                </div>
              </div>
            </div>

            <div class="absolute -top-6 -right-6 bg-white rounded-2xl shadow-xl p-6">
              <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-[#0A2647]/10 rounded-xl flex items-center justify-center">
                  <span class="text-2xl">👥</span>
                </div>
                <div>
                  <div class="font-bold text-2xl text-[#0A2647]">5000+</div>
                  <div class="text-sm text-gray-600">O'quvchilar</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Gradient Overlay at Bottom -->
      <div class="absolute bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-white to-transparent z-10"></div>
    </section>
